<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23031147'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='%232f86d6'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%232f86d6'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='%23fdc805'/%3E%3C/svg%3E"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>グループ進捗ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+JP:wght@900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: one centered column（旅キャリ DMダッシュボードと同じトンマナ）。KV＝全体の達成率と、5段階の信号に並んだグループ → グループ別カード（数字・ルール/目標・やること）→ 今日やること → くわしく。
   信号の色（介入＝赤・もう一歩＝橙・いいペース＝空色・走り切れる＝緑・最高＝金）はアクセントとは別の意味の色。 */
:root {
  --bg: #f3f6fb; --surface: #ffffff; --ink: #101a38; --muted: #5b6886; --line: #dde4f0;
  --navy: #031147; --head: #0b1d5c; --sky: #2f86d6; --sky-soft: #e6f0fb;
  --yellow: #fdc805; --gold-ink: #946f00; --yellow-soft: #fff4c4;
  --s-alert: #d23f2b; --s-alert-soft: #fde6e1; --s-watch: #e07b12; --s-watch-soft: #fdeedb;
  --s-good: #2f86d6; --s-good-soft: #e6f0fb; --s-run: #2f8a4f; --s-run-soft: #e2f3e7; --s-best: #c79300; --s-best-soft: #fff4c4; --s-none: #a3adc4; --s-none-soft: #eef1f7;
  --btn-bg: #031147; --btn-ink: #ffffff;
  --hero-bg1: #031147; --hero-bg2: #173c8e; --hero-ink: #ffffff; --hero-muted: #b9c6e6; --hero-line: rgba(255,255,255,.22); --hero-chip: rgba(255,255,255,.09); --hero-yellow: #fdc805;
  --font-jp: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-num: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-brand: "Noto Sans JP", "Hiragino Sans", "Zen Kaku Gothic New", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1122; --surface: #121a31; --ink: #e8edf8; --muted: #9aa8c6; --line: #26324f;
    --navy: #b8c8f2; --head: #c9d6f7; --sky: #6fb0f0; --sky-soft: #16294a;
    --yellow: #fdc805; --gold-ink: #f5cf3c; --yellow-soft: #3a3010;
    --s-alert: #ff8b74; --s-alert-soft: #3d1b16; --s-watch: #f6a54e; --s-watch-soft: #3a2810;
    --s-good: #6fb0f0; --s-good-soft: #16294a; --s-run: #7fd197; --s-run-soft: #173123; --s-best: #f5cf3c; --s-best-soft: #3a3010; --s-none: #5c6784; --s-none-soft: #1a2340;
    --btn-bg: #fdc805; --btn-ink: #031147;
    --hero-bg1: #08143a; --hero-bg2: #183a80; --hero-ink: #eef3fb; --hero-muted: #a9bde3; --hero-line: rgba(255,255,255,.16); --hero-chip: rgba(255,255,255,.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1122; --surface: #121a31; --ink: #e8edf8; --muted: #9aa8c6; --line: #26324f;
  --navy: #b8c8f2; --head: #c9d6f7; --sky: #6fb0f0; --sky-soft: #16294a;
  --yellow: #fdc805; --gold-ink: #f5cf3c; --yellow-soft: #3a3010;
  --s-alert: #ff8b74; --s-alert-soft: #3d1b16; --s-watch: #f6a54e; --s-watch-soft: #3a2810;
  --s-good: #6fb0f0; --s-good-soft: #16294a; --s-run: #7fd197; --s-run-soft: #173123; --s-best: #f5cf3c; --s-best-soft: #3a3010; --s-none: #5c6784; --s-none-soft: #1a2340;
  --btn-bg: #fdc805; --btn-ink: #031147;
  --hero-bg1: #08143a; --hero-bg2: #183a80; --hero-ink: #eef3fb; --hero-muted: #a9bde3; --hero-line: rgba(255,255,255,.16); --hero-chip: rgba(255,255,255,.06);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-jp); font-size: 15px; line-height: 1.65; }
.wrap > * { min-width: 0; }
/* 1列のグリッドは、中身の長さで横に広がらないように列幅を固定する */
.wrap, .kv, .sec, .gc, .gc-body, .wc, .acts, .items, .spark, .up-card, .kv-copy, .gc-name, .ac-main, .todo-in, .todo-in ul { grid-template-columns: minmax(0, 1fr); }
.kv > *, .gc-body > *, .wc > * { min-width: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; gap: 24px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* 信号の色を、要素ごとに --c / --cs で受け取る */
.s-alert { --c: var(--s-alert); --cs: var(--s-alert-soft); }
.s-watch { --c: var(--s-watch); --cs: var(--s-watch-soft); }
.s-good  { --c: var(--s-good);  --cs: var(--s-good-soft); }
.s-run   { --c: var(--s-run);   --cs: var(--s-run-soft); }
.s-best  { --c: var(--s-best);  --cs: var(--s-best-soft); }
.s-none  { --c: var(--s-none);  --cs: var(--s-none-soft); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 900; background: var(--cs); color: var(--c); white-space: nowrap; line-height: 1.5; }
.pill svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pill.solid { background: var(--c); color: #fff; }
.s-best .pill.solid, .pill.solid.s-best { color: #031147; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { flex: none; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 16px; background: var(--yellow); color: #031147; font: 900 13px/1.05 var(--font-brand); text-align: center; }
.logo span { display: inline-block; transform: skewX(-12deg); }
.eyebrow { font: 700 11.5px var(--font-num); letter-spacing: .22em; color: var(--muted); }
h1 { font-size: clamp(22px, 3.6vw, 30px); font-weight: 900; color: var(--head); line-height: 1.25; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--s-run); }
.leader-note { margin: -12px 0 0; font-size: 13px; padding: 9px 13px; border-radius: 10px; background: var(--yellow-soft); border: 1px solid var(--line); }

/* KV */
.kv { position: relative; overflow: hidden; border-radius: 20px; padding: 24px 24px 22px; color: var(--hero-ink);
  background: radial-gradient(110% 80% at 92% 0%, rgba(253, 200, 5, .16), transparent 55%), linear-gradient(150deg, var(--hero-bg1), var(--hero-bg2)); display: grid; gap: 22px; }
.kv-head { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 24px; }
.kv-copy { display: grid; gap: 8px; min-width: 0; }
.kv-eyebrow { font: 700 12px var(--font-num); letter-spacing: .24em; color: var(--hero-yellow); }
.kv-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-family: var(--font-brand); font-weight: 900; }
.kv-big .lb { font-size: clamp(16px, 2.4vw, 20px); }
.kv-big .n { font-family: var(--font-num); font-weight: 700; font-size: clamp(54px, 9vw, 80px); line-height: .95; font-variant-numeric: tabular-nums; }
.kv-big .n small { font-size: .42em; margin-left: 2px; }
.kv-big .pill { align-self: center; font-size: 15px; padding: 5px 14px 5px 10px; }
.kv-sub { color: var(--hero-muted); font-size: 14px; }
.kv-sub b { color: var(--hero-ink); font-family: var(--font-num); font-size: 16px; }
.filters { display: grid; gap: 8px; justify-items: end; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--hero-bg1) 72%, transparent); border: 1px solid var(--hero-line); }
.seg button { border: 0; background: transparent; color: var(--hero-muted); padding: 5px 12px; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--hero-yellow); color: #031147; }
.seg-l { font-size: 11px; font-weight: 700; color: var(--hero-muted); letter-spacing: .08em; }
@media (max-width: 760px) { .filters { justify-items: start; } .kv { padding: 20px 16px 18px; } }

/* 5段階の信号（左ほど要注意） */
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stop { position: relative; display: grid; align-content: start; gap: 6px; padding: 12px 12px 12px; border-radius: 14px; background: var(--hero-chip); border: 1px solid var(--hero-line); min-width: 0; }
.stop .hd { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 900; line-height: 1.3; }
.stop .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.stop .rg { font: 600 11.5px var(--font-num); color: var(--hero-muted); }
.stop .cnt { font: 700 34px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.stop .cnt span { font: 700 12px var(--font-jp); color: var(--hero-muted); margin-left: 3px; }
.stop.zero .cnt { color: var(--hero-muted); opacity: .6; }
.stop.alert-on { background: color-mix(in srgb, var(--s-alert) 26%, transparent); border-color: color-mix(in srgb, #ff8b74 70%, transparent); }
.stop.alert-on .dot { animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 10%, transparent); } }
@media (prefers-reduced-motion: reduce) { .stop.alert-on .dot { animation: none; } }
.gchips { display: flex; flex-wrap: wrap; gap: 4px; }
.gchips a { display: inline-block; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.12); color: var(--hero-ink); font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.gchips a:hover { background: var(--hero-yellow); color: #031147; }
.gchips .sm { display: none; }
@media (max-width: 760px) {
  .track { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .stop { padding: 8px 6px; gap: 4px; }
  .stop .hd { font-size: 11px; flex-direction: column; align-items: flex-start; gap: 4px; }
  .stop .rg { font-size: 10.5px; }
  .stop .cnt { font-size: 26px; }
  .gchips a { font-size: 10.5px; padding: 0 5px; }
  .gchips .lg { display: none; } .gchips .sm { display: inline; }
  .stop .cnt span { display: none; }
}

.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--hero-line); padding-top: 16px; }
.tot { display: grid; gap: 2px; padding: 0 16px; border-left: 1px solid var(--hero-line); min-width: 0; }
.tot:first-child { border-left: 0; padding-left: 0; }
.tot .k { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--hero-muted); }
.tot .k svg { width: 15px; height: 15px; fill: none; stroke: var(--hero-yellow); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tot .v { font: 700 36px/1.1 var(--font-num); font-variant-numeric: tabular-nums; }
.tot .v span { font: 700 13px var(--font-jp); color: var(--hero-muted); margin-left: 3px; }
.tot .s { font-size: 12px; color: var(--hero-muted); }
.tot.deal .v { color: var(--hero-yellow); }
@media (max-width: 760px) { .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; } .tot:nth-child(3) { border-left: 0; padding-left: 0; } .tot .v { font-size: 30px; } }

/* section heads */
.sec { display: grid; gap: 14px; min-width: 0; }
.sec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sec-h .ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--navy); color: var(--bg); flex: none; }
.sec-h .ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sec-h h2 { font-size: 20px; font-weight: 900; color: var(--head); }
.badge { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--yellow); color: #031147; font: 700 14px var(--font-num); }
.badge.red { background: var(--s-alert); color: #fff; }
.sec-h .scope { margin-left: auto; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }

/* グループカード */
.groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 900px) { .groups { grid-template-columns: minmax(0, 1fr); } }
.gc { position: relative; display: grid; gap: 14px; padding: 0; overflow: hidden; scroll-margin-top: 12px; }
.gc::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c); }
.gc.s-alert { border-color: color-mix(in srgb, var(--s-alert) 55%, var(--line)); }
.gc-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start; padding: 16px 18px 0 24px; }
.gc.s-alert .gc-top { background: linear-gradient(180deg, var(--cs), transparent); padding-bottom: 12px; margin-bottom: -12px; }
.gc-name { display: grid; gap: 4px; min-width: 0; }
.gc-name h3 { font-size: 18px; font-weight: 900; color: var(--head); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.gc-name h3 .ch { font: 600 12.5px var(--font-jp); color: var(--muted); }
.gc-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.lead { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; background: var(--sky-soft); color: var(--head); }
.lead svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.left-d { color: var(--s-watch); }
.gc-ach { display: grid; justify-items: end; gap: 4px; }
.gc-ach .v { font: 700 44px/1 var(--font-num); color: var(--c); font-variant-numeric: tabular-nums; }
.gc-ach .v small { font-size: 18px; margin-left: 1px; }
.gc-ach .v.na { font-size: 22px; color: var(--muted); }
.gc-body { display: grid; gap: 14px; padding: 0 18px 18px 24px; }
.meter { position: relative; height: 12px; border-radius: 999px; background: var(--bg); margin-top: 6px; }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--c); }
.meter .tk { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--surface); }
.meter-l { position: relative; height: 14px; font: 600 10.5px var(--font-num); color: var(--muted); }
.meter-l span { position: absolute; transform: translateX(-50%); }
.m4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.m4 div { border-radius: 10px; background: var(--bg); padding: 8px 10px; min-width: 0; }
.m4 .k { font-size: 11.5px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.m4 .v { font: 700 24px/1.15 var(--font-num); color: var(--head); font-variant-numeric: tabular-nums; }
.m4 .v span { font: 700 11.5px var(--font-jp); color: var(--muted); margin-left: 2px; }
.m4 .s { font-size: 11px; color: var(--muted); line-height: 1.4; }
.m4 .deal .v { color: var(--gold-ink); }
@media (max-width: 520px) { .m4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.spark { display: grid; gap: 4px; }
.spark-h { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-weight: 700; }
.spark svg { display: block; width: 100%; height: 48px; overflow: visible; }
.items { display: grid; gap: 8px; }
.it { display: grid; grid-template-columns: minmax(0, 1fr) 120px 46px; gap: 4px 10px; align-items: center; font-size: 13.5px; }
.it .lbl { min-width: 0; display: flex; gap: 6px; align-items: baseline; }
.it .tag { flex: none; font-size: 10.5px; font-weight: 900; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.it .tag.goal { border-color: var(--yellow); background: var(--yellow-soft); color: var(--gold-ink); }
.it .txt { font-weight: 700; color: var(--ink); }
.it .bar { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.it .bar span { display: block; height: 100%; border-radius: 999px; background: var(--c); }
.it .pct { font: 700 15px var(--font-num); text-align: right; color: var(--c); font-variant-numeric: tabular-nums; }
.it .pct.na { color: var(--muted); font-size: 12px; font-family: var(--font-jp); }
.it .sub { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); margin-top: -2px; padding-left: 40px; }
@media (max-width: 520px) { .it { grid-template-columns: minmax(0, 1fr) 70px 42px; } .it .sub { padding-left: 0; } }
.ppl { display: flex; flex-wrap: wrap; gap: 6px; }
.pp { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--bg); font-size: 12.5px; font-weight: 700; }
.pp b { font: 700 13.5px var(--font-num); color: var(--head); }
.pp small { font-size: 10.5px; color: var(--muted); }
.pp.stop0 { background: var(--s-alert-soft); color: var(--s-alert); }
.pp.stop0 b { color: var(--s-alert); }
.pp .ld { font-size: 10px; font-weight: 900; color: var(--sky); }
.todo-in { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--cs); }
.todo-in h4 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; color: var(--c); }
.todo-in h4 svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.todo-in ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.todo-in li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; font-size: 13.5px; align-items: baseline; }
.todo-in li .w { font-size: 11px; font-weight: 900; padding: 0 7px; border-radius: 999px; background: var(--surface); color: var(--head); white-space: nowrap; }
.todo-in li p { font-weight: 700; }
.todo-in li small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.gc-note { font-size: 12.5px; color: var(--muted); }
details.more summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--sky); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary { margin-bottom: 8px; }
.up-card { display: grid; gap: 8px; padding: 18px 18px 18px 24px; }

/* 今日やること（だれが・何を） */
.who-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 900px) { .who-grid { grid-template-columns: minmax(0, 1fr); } }
.wc { display: grid; gap: 12px; }
.wc-h { display: flex; align-items: center; gap: 10px; }
.av { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--navy); color: var(--bg); font: 900 15px var(--font-brand); }
.wc.mgr .av { background: var(--yellow); color: #031147; }
.wc-h h3 { font-size: 16.5px; font-weight: 900; color: var(--head); line-height: 1.3; }
.wc-h small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.wc-h .cnts { margin-left: auto; display: flex; gap: 4px; }
.wc-h .cnts span { font: 700 12px var(--font-num); padding: 1px 8px; border-radius: 999px; background: var(--cs); color: var(--c); }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ac { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 10px 12px 10px 0; border-radius: 12px; background: var(--bg); overflow: hidden; }
.ac::before { content: ""; grid-row: 1 / span 2; align-self: stretch; background: var(--c); border-radius: 0 4px 4px 0; }
.ac.done { opacity: .5; }
.ac.done .ac-t { text-decoration: line-through; }
.ac-main { display: grid; gap: 3px; min-width: 0; }
.ac-hd { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.ac-hd .pill { padding: 0 8px 0 6px; font-size: 11px; }
.ac-hd .pill svg { width: 12px; height: 12px; }
.ac-hd a { color: var(--sky); text-decoration: none; font-weight: 900; }
.ac-t { font-size: 14.5px; font-weight: 900; color: var(--head); overflow-wrap: anywhere; line-height: 1.5; }
.ac ul { margin: 0; padding-left: 1.1em; display: grid; gap: 1px; font-size: 12.5px; color: var(--muted); }
.ac ul li b { color: var(--ink); }
.ck { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); padding: 3px 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); white-space: nowrap; }

.empty { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }

function spark(daily) {

    return `<rect x="${(i * bw + 1.5).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${d.v ? "var(--sky)" : "var(--line)"}"><title>${md(d.d)}　${d.v}件</title></rect>`;
  }).join("");
  const last = daily[n - 1];
  return `<div class="spark"><div class="spark-h"><span>毎日のDM（14日）</span><span>${md(daily[0].d)}〜${md(last.d)}・最大 ${mx}件/日</span></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="14日間の毎日のDM件数">${bars}</svg></div>`;

  document.getElementById("acts").innerHTML = whos.length ? whos.map(w => {
    const xs = list.filter(a => a.who === w);
    const c = { alert: xs.filter(a => a.level === "alert").length, watch: xs.filter(a => a.level === "watch").length };
    return `<article class="card wc ${isMgr(w) ? "mgr" : ""}"><div class="wc-h"><span class="av">${esc(w.slice(0, 1))}</span><div><h3>${esc(w)}</h3><small>${isMgr(w) ? "マネージャーがやること" : "リーダーにお願いすること"}</small></div>
      <span class="cnts">${c.alert ? `<span class="s-alert">介入 ${c.alert}</span>` : ""}${c.watch ? `<span class="s-watch">もう一歩 ${c.watch}</span>` : ""}</span></div>
      <ol class="acts">${xs.map((a, j) => {
        const id = aid(a), isDone = done.includes(id), n = i++;
        const gs = (a.groups || [a.group]).map(k => D.groups.find(x => x.key === k));
        return (j === 5 ? `</ol><details class="more"><summary>残り${xs.length - 5}件を見る</summary><ol class="acts">` : "") + `<li class="ac s-${SC[a.level]}${isDone ? " done" : ""}"><div class="ac-main"><div class="ac-hd"><span class="pill s-${SC[a.level]}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[a.level]}</svg>${LT[a.level]}</span>${gs.map((g, j) => g ? `<a href="#${gid(g.key)}">${esc(g.key)}</a>` : `<span>${esc((a.groups || [a.group])[j])}</span>`).join("")}</div>
          <p class="ac-t">${esc(a.title.replace(/^[^：]+：/, ""))}</p>
          <ul>${a.why.map(x => `<li>${x.startsWith("打ち手") ? "<b>" + esc(x) + "</b>" : esc(x)}</li>`).join("")}</ul></div>
          <label class="ck"><input type="checkbox" id="ck-${n}" data-id="${esc(id)}" ${isDone ? "checked" : ""}>やった</label></li>`;
      }).join("")}</ol>${xs.length > 5 ? "</details>" : ""}</article>`;
  }).join("") : `<div class="card empty">今日やることはありません。</div>`;
  document.querySelectorAll("#acts input[type=checkbox]").forEach(cb => cb.onchange = () => {
    let d = getDone(); const id = cb.dataset.id;
    d = cb.checked ? d.concat([id]) : d.filter(x => x !== id); setDone(d);
    cb.closest(".ac").classList.toggle("done", cb.checked);
  });
}

function renderTable() {
  const gs = D.groups.filter(g => inScope(g) && !g.upcoming);
  const S = D.summary[st.l][st.p];
  const rows = gs.map(g => {
    const P = g.per[st.p], m = P.m;
    return `<tr><td><a href="#${gid(g.key)}" style="color:var(--head);font-weight:900;text-decoration:none">${esc(g.key)}</a><span class="p">${esc(g.leader_name)}・${esc(P.range)}</span></td>
      <td class="ach s-${P.sig}">${P.ach == null ? "—" : P.ach + "%"}</td><td>${pill(P.sig)}</td>
      <td><span class="c">${fmt(m.dm)}</span></td><td><span class="c">${m.dm_people}/${m.people}</span></td><td><span class="c">${fmt(m.reply)}</span><span class="p">${m.listdm ? (Math.round(m.reply / m.listdm * 1000) / 10) + "%" : "—"}</span></td>
      <td><span class="c">${fmt(m.sample)}</span>${m.pending ? `<span class="p">決済待ち ${m.pending}</span>` : ""}</td><td><span class="c">${fmt(m.order)}</span></td></tr>`;
  }).join("");
  document.getElementById("tbl").innerHTML = `<thead><tr><th>グループ</th><th>達成率</th><th class="l">信号</th><th>DM送信</th><th>送った人</th><th>返信<span class="p">返信率</span></th><th>サンプル決済</th><th>成約</th></tr></thead><tbody>${rows}
    <tr class="sum"><td>合計（同じ人は1回）</td><td class="ach s-${S.sig}">${S.ach == null ? "—" : S.ach + "%"}</td><td>平均</td><td><span class="c">${fmt(S.dm)}</span></td><td><span class="c">${S.dm_people}/${S.people}</span></td><td><span class="c">${fmt(S.reply)}</span></td><td><span class="c">${fmt(S.sample)}</span></td><td><span class="c">${fmt(S.order)}</span></td></tr></tbody>`;
}

function renderStatic() {
  document.getElementById("stamp").textContent = `${md(D.y)}までの数字・毎朝更新`;
  document.getElementById("legend").innerHTML = ORDER.slice().reverse().map(s => `<span class="s-${s}"><i></i>${SIG[s].t}（${SIG[s].r}）</span>`).join("");
  document.getElementById("sigScale").innerHTML = ORDER.map(s => `<div class="s-${s}">${SIG[s].t}<small>${SIG[s].r}</small></div>`).join("");
  const DEF = [
    ["達成率", "グループで決めたルールと目標、それぞれの達成度の平均。1つ100%で頭打ち（1つが大きく超えても、守れていないルールが隠れないように）。"],
    ["ルールの達成度", "ルールの形ごとに「守れた日（週）の割合」をメンバーごとに出して平均。例：1日◯件以上の日の割合、DMを送った日にグループへ投稿した日の割合、週◯件に届いた週の割合（「◯/42件」の報告も見る）。直近7日の週◯件ルールは、終わった直近の1週間で見ます。"],
    ["目標の達成度", "実績 ÷ 今日までに来ていたい数（期限までの日割り）。サンプル・成約の目標は件数が少ないので、期間の半分を過ぎるまで0件なら「判定前」にして平均に入れません。"],
    ["DM送信", "日ごとに、全体共有リストの行数と、グループ・専用部屋の自己報告（「本日：◯通」「◯/42件」など）の多い方。リストへの記入漏れがある人がいるため。"],
    ["返信", "全体共有リストの「返信」◯。最初にDMした日の行に付くので、その期間に送ったDMへの返信の数（最近の分はこれから増えます）。返信率＝返信 ÷ リストに記入されたDM。"],
    ["サンプル決済", "サンプル申込フォームの「サンプル発送状況」が〇か決済完了の行（申込日で数える）。受講生本人宛ては数えません。決済待ちは別に表示。"],
    ["成約", "「抹茶 売上表（運営用）」の行（入金日・成約日）。日付が分からない行は期間に入れていません。サンプルは含みません。"],
    ["だれを数えるか", "グループ設定のメンバー（リーダーがメンバーのクラスはリーダーも）。退会した人は入れません。2つのグループにいる人は、上の合計では1回だけ数えます。"],
    ["今日やること", "直近7日の数字で判定。達成率が80%未満のグループは、いちばん守れていないルール・目標と打ち手を出します。ほかに、7日DMがない人・決済待ち・グループの終わり・リーダーの投稿がない場合も出ます。"],
    ["データの時点", `全体共有リスト ${esc(D.src.list)}・サンプル申込フォーム ${esc(D.src.form || "—")}・売上表 ${esc(D.src.sales || "—")}・Discord は毎朝の取り込み分（${md(D.y)}まで）。`]
  ];
  document.getElementById("defs").innerHTML = DEF.map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join("");
  document.getElementById("foot").textContent = `作成 ${D.built}・元のスプレッドシートには何も書き込んでいません`;
}

function render() {
  renderSegs(); renderKV();
  const gs = D.groups.filter(inScope).slice().sort((a, b) => {
    if (a.upcoming !== b.upcoming) return a.upcoming ? 1 : -1;
    const x = a.per[st.p].ach, y = b.per[st.p].ach;
    return (x == null ? 999 : x) - (y == null ? 999 : y);
  });
  document.getElementById("gScope").textContent = `${lname(st.l)}・${PLAB[st.p]}・達成率の低い順`;
  document.getElementById("groups").innerHTML = gs.map(groupCard).join("");
  renderActs(); renderTable();
  try { history.replaceState(null, "", st.l === "all" ? location.pathname + location.search : "#" + Object.keys(LKEY).find(k => LKEY[k] === st.l)); } catch (e) {}
}
if (D) { renderStatic(); render(); }
</script>
